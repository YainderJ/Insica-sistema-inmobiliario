{% extends 'base/base.html' %}

{% block title %}Captar Nuevo Inmueble - INSICA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-house-add"></i> Registrar Nueva Propiedad</h4>
            </div>
            
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">Ingresa los datos del nuevo inmueble para publicarlo en el catálogo.</p>
                
                <!-- El atributo enctype es crucial para permitir la subida de fotografías -->
                <form action="{{ url_for('inmuebles.registrar_inmueble') }}" method="POST" enctype="multipart/form-data">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tipo_operacion" class="form-label fw-bold">Tipo de Operación *</label>
                            <select class="form-select" id="tipo_operacion" name="tipo_operacion" required>
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="VENTA">Venta</option>
                                <option value="ALQUILER">Alquiler</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="tipo_inmueble" class="form-label fw-bold">Tipo de Inmueble *</label>
                            <select class="form-select" id="tipo_inmueble" name="tipo_inmueble" required>
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="CASA">Casa</option>
                                <option value="APARTAMENTO">Apartamento</option>
                                <option value="LOCAL COMERCIAL">Local Comercial</option>
                                <option value="TERRENO">Terreno</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="direccion" class="form-label fw-bold">Dirección / Ubicación *</label>
                        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ej: Av. 4 Bella Vista, Maracaibo" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="precio" class="form-label fw-bold">Precio (USD) *</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" id="precio" name="precio" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <!-- Campo para las fotografías del inmueble -->
                            <label for="fotografias" class="form-label fw-bold">Fotografías del Inmueble *</label>
                            <input type="file" class="form-control" id="fotografias" name="fotografias" accept="image/*" multiple required>
                            <div class="form-text">Formatos válidos: JPG, PNG. Puede seleccionar varias imágenes.</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="descripcion_general" class="form-label fw-bold">Descripción General *</label>
                        <textarea class="form-control" id="descripcion_general" name="descripcion_general" rows="4" placeholder="Describe las características principales de la propiedad..." required></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="bi bi-cloud-arrow-up"></i> Guardar y Publicar Inmueble
                        </button>
                        <a href="{{ url_for('inmuebles.catalogo') }}" class="btn btn-outline-secondary rounded-pill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
